name: Build ROM & Publish Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/copilot-instructions.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Cache Vanilla Retail Base ROM
        id: cache-vanilla-base
        uses: actions/cache@v4
        with:
          path: vanilla_emerald.gba
          key: vanilla-emerald-base-b75f28d0

      - name: Cache Host Tools & agbcc
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            tools/agbcc
            tools/gbagfx/gbagfx
            tools/scaninc/scaninc
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/gbafix/gbafix
            tools/rsfont/rsfont
            tools/mapjson/mapjson
            tools/aif2pcm/aif2pcm
            tools/mid2agb/mid2agb
          key: tools-agbcc-${{ hashFiles('make_tools.mk', 'tools/**') }}

      - name: Setup agbcc
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..
          rm -rf agbcc

      - name: Build Host Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          make -f make_tools.mk -j$(nproc)

      - name: Compile Mico's Emerald Legacy ROM
        run: |
          make -j$(nproc)

      - name: Build Vanilla Retail Pokémon Emerald Base (If not cached)
        if: steps.cache-vanilla-base.outputs.cache-hit != 'true'
        run: |
          git worktree add /tmp/vanilla_build b75f28d0
          cd /tmp/vanilla_build
          find . -name "*.pal" -exec perl -pi -e 's/\r?\n/\r\n/' {} +
          rm -rf tools/agbcc
          ln -s "$GITHUB_WORKSPACE/tools/agbcc" tools/agbcc
          make -f make_tools.mk -j$(nproc)
          make -j$(nproc)
          cp pokeemerald.gba "$GITHUB_WORKSPACE/vanilla_emerald.gba"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/vanilla_build

      - name: Generate BPS Patch File
        run: |
          python3 tools/make_bps.py vanilla_emerald.gba pokeemerald.gba Micos_Emerald_Legacy.bps

      - name: Determine Version Tag
        id: versioning
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEXT_TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            NEXT_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_WITHOUT_V="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline 2>/dev/null || git log -n 10 --oneline)
            if echo "$COMMITS" | grep -qE "BREAKING CHANGE|feat!:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ feat(\(.*\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (fix|docs|chore)(\(.*\))?:"; then
              PATCH=$((PATCH + 1))
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "Next tag: $NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.versioning.outputs.latest_tag }}"
          CHANGES=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Routine build update")
          if [ -z "$CHANGES" ]; then
            CHANGES="- Routine build update"
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Micos-Emerald-Legacy-Build-${{ steps.versioning.outputs.next_tag }}
          path: |
            pokeemerald.gba
            Micos_Emerald_Legacy.bps

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.next_tag }}
          name: "Mico's Emerald Legacy ${{ steps.versioning.outputs.next_tag }}"
          body: |
            ### 🎮 Mico's Pokémon Emerald Legacy ${{ steps.versioning.outputs.next_tag }}

            #### 📝 What's Changed in this Release:
            ${{ steps.changelog.outputs.changes }}

            #### 🕹️ Quick Patching Instructions:
            1. Download **`Micos_Emerald_Legacy.bps`** below.
            2. Open [Marc Robledo's ROM Patcher JS](https://marcrobledo.com/RomPatcher.js/).
            3. Apply the patch to your clean **Pokémon Emerald (USA, Europe)** ROM.

            ---
            👉 **Full Feature Documentation**: Check out the [**Project README**](https://github.com/Mickosis/Mico_Emerald_Legacy#readme) for complete mechanics and guides!
          files: |
            Micos_Emerald_Legacy.bps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
