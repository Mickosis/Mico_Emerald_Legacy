name: Build ROM & Publish Release

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/copilot-instructions.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/copilot-instructions.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev build-essential python3 git

      - name: Setup agbcc
        run: |
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..
          rm -rf agbcc

      - name: Build Host Tools
        run: |
          make -f make_tools.mk -j$(nproc)

      - name: Compile Mico's Emerald Legacy ROM
        run: |
          make -j$(nproc)

      - name: Build Vanilla Retail Pokémon Emerald Base
        run: |
          git worktree add /tmp/vanilla_build b75f28d0
          cd /tmp/vanilla_build
          find . -name "*.pal" -exec perl -pi -e 's/\r?\n/\r\n/' {} +
          rm -rf tools/agbcc
          ln -s "$GITHUB_WORKSPACE/tools/agbcc" tools/agbcc
          make -f make_tools.mk -j$(nproc)
          make -j$(nproc)
          cp pokeemerald.gba "$GITHUB_WORKSPACE/vanilla_emerald.gba"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/vanilla_build

      - name: Generate BPS Patch File
        run: |
          python3 tools/make_bps.py vanilla_emerald.gba pokeemerald.gba Micos_Emerald_Legacy.bps

      - name: Determine Version Tag
        id: versioning
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEXT_TAG="${{ github.event.inputs.version }}"
          elif startsWith "${{ github.ref }}" "refs/tags/"; then
            NEXT_TAG="${GITHUB_REF#refs/tags/}"
          else
            NEXT_TAG="$LATEST_TAG"
          fi
          
          echo "Next tag: $NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.versioning.outputs.latest_tag }}"
          CHANGES=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Routine build update")
          if [ -z "$CHANGES" ]; then
            CHANGES="- Routine build update"
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Micos-Emerald-Legacy-Build-${{ steps.versioning.outputs.next_tag }}
          path: |
            pokeemerald.gba
            Micos_Emerald_Legacy.bps

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.next_tag }}
          name: "Mico's Emerald Legacy ${{ steps.versioning.outputs.next_tag }}"
          body: |
            ### 🎮 Mico's Pokémon Emerald Legacy ${{ steps.versioning.outputs.next_tag }}

            Built on top of [Pokémon Emerald Legacy](https://github.com/cRz-Shadows/Pokemon_Emerald_Legacy) with modern Quality of Life while **preserving 100% authentic Pokémon stats, movesets, learnsets, and battle mechanics**.

            #### 📝 Changelog for this release:
            ${{ steps.changelog.outputs.changes }}

            #### 🌟 Included Quality of Life Features:
            - **Overworld Follower Pokémon**: Full Gen 1–3 walking followers.
            - **Dynamic Surfing Overworld Sprites**: Custom per-species surfing graphics.
            - **Field Move / HM Bag Checks**: Use HM field moves without teaching them to moveslots.
            - **EXP. All**: Toggleable Key Item from Mr. Stone.
            - **In-Game EV / IV Stat Editor**: Inspect and adjust IVs/EVs in party menu (±10 with L/R after National Dex).
            - **Nature Mints & Ability Capsules**: Sold in Pretty Petal Flower Shop, Slateport, & Battle Frontier.
            - **Post-Game Egg Move Tutor**: Fallarbor Town after beating the Champion.
            - **Fly to Secret Base & Lilycove Rooftop**: Direct map flight.
            - **Secret Base Exclusive Items & Rooftop Clearance**: Seedot/Lotad dolls, Red/Blue tents, and permanent post-game clearance sale.
            - **Modern Premier Ball Scaling**: 1 Premier Ball per 10 Pokéballs bought in bulk.
            - **Repel Auto-Prompt**: Instant prompt when Repel wears off.
            - **TV Roamer Tracking**: Marks Latias/Latios as Seen in Pokédex upon TV news choice.
            - **Register Battle Frontier Opponents as Seen**: Any Pokémon encountered in Battle Frontier or Trainer Hill is marked as Seen in your Pokédex.
            - **Soot Sack Counter**: Check ash quantity directly from the Bag.
            - **Renewable PP Up & PP Max**: At the Battle Frontier Vitamin Vendor.

            #### 💾 Save File Compatibility:
            - **100% Compatible with Base Emerald Legacy Saves**: Memory structures and offsets match byte-for-byte (`0x3D88`). Drop your existing `.sav` save file straight in!

            #### 🕹️ How to Patch:
            1. Download `Micos_Emerald_Legacy.bps` below.
            2. Open [Marc Robledo's ROM Patcher JS](https://marcrobledo.com/RomPatcher.js/).
            3. Apply `Micos_Emerald_Legacy.bps` to your clean **Pokémon Emerald (USA, Europe)** ROM.
          files: |
            Micos_Emerald_Legacy.bps
            pokeemerald.gba
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
